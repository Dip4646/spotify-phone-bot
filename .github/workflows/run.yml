name: הפעלת בוט הטלפון של Spotify

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install spotipy requests yt-dlp
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Bot Script
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YEMOT_SYSTEM_NUMBER: ${{ secrets.YEMOT_SYSTEM_NUMBER }}
          YEMOT_PASSWORD: ${{ secrets.YEMOT_PASSWORD }}
        run: python bot.py
